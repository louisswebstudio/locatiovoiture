# Netlify config — Bestore Car
# Static site (plain HTML/CSS/JS, no build step). The browser talks directly
# to Supabase using the public keys in js/supabase-config.js, so there is no
# server-side backend to deploy here — Netlify just serves these files.

[build]
  publish = "."
  command = ""

# ──────────────────────────────────────────────
#  Clean URLs (mirror the old vercel.json routes)
# ──────────────────────────────────────────────
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/fleet"
  to = "/fleet.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# ──────────────────────────────────────────────
#  Defense in depth: never serve server-only / source files.
#  force = true beats static files. NOTE: Netlify's "*" is a TRAILING
#  splat only — extension globs like /*.sql do NOT work, so each
#  server-only file is listed by its exact path (or a /dir/* splat).
# ──────────────────────────────────────────────
[[redirects]]
  from = "/seed.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/create-agency-user.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/schema.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/migrate-blacklist.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# ──────────────────────────────────────────────
#  Security headers
# ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
