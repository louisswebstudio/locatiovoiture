# Netlify config — Bestore Car
# Static site (plain HTML/CSS/JS, no build step). The browser talks directly
# to Supabase using the public keys in js/supabase-config.js, so there is no
# server-side backend to deploy here — Netlify just serves these files.

[build]
  publish = "."
  command = ""

# ──────────────────────────────────────────────
#  Clean URLs (mirror the old vercel.json routes)
# ──────────────────────────────────────────────
[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/fleet"
  to = "/fleet.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# ──────────────────────────────────────────────
#  Defense in depth: never serve server-only / source files,
#  even if one slips into the repo. force = true beats static files.
# ──────────────────────────────────────────────
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.mjs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seed.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/create-agency-user.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/404.html"
  status = 404
  force = true

# ──────────────────────────────────────────────
#  Security headers
# ──────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
